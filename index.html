
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101522">
<title>دخل و خرج من</title>
<style>
:root{
--bg:#101522;--panel:#192233;--panel2:#202c40;
--text:#f3f5fa;--muted:#91a0b6;--green:#27d6a0;
--red:#ff647c;--blue:#718cff;--gold:#f5c76b
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial;padding:18px}
.app{max-width:850px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin:12px 0 24px}
.brand{font-size:23px;font-weight:bold}
.brand span{color:var(--green)}
.sub{font-size:12px;color:var(--muted);margin-top:7px}
button{cursor:pointer;border:0;font-family:inherit}
.settings{background:var(--panel2);color:white;padding:11px 14px;border-radius:12px;font-size:19px}
.welcome{background:linear-gradient(120deg,#263c58,#192a43);padding:22px;border-radius:20px;margin-bottom:17px;border:1px solid #344965}
.welcome small{color:#b6c7df}
.welcome h2{margin:10px 0;font-size:26px}
.date{font-size:12px;color:#b6c7df}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--panel);border:1px solid #29364a;padding:17px;border-radius:17px;min-width:0}
.card small{color:var(--muted);font-size:12px}
.amount{font-size:19px;font-weight:bold;margin-top:12px;overflow-wrap:anywhere}
.green{color:var(--green)}.red{color:var(--red)}.blue{color:#91a6ff}
.section{margin-top:25px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
h3{font-size:16px;margin:0}
.panel{background:var(--panel);border:1px solid #29364a;border-radius:17px;padding:17px}
.chart{display:flex;gap:17px;align-items:end;height:145px;margin-top:20px}
.chart-col{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:end;gap:8px}
.bar-area{height:110px;display:flex;align-items:end;justify-content:center;gap:5px}
.bar{width:32%;max-width:38px;border-radius:7px 7px 3px 3px;min-height:3px}
.bar.in{background:var(--green)}.bar.out{background:var(--red)}
.chart-label{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:18px;font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px}
form{display:grid;gap:12px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{padding:13px;border-radius:12px;background:var(--panel2);color:var(--muted);font-size:14px;border:1px solid transparent}
.type.active.income{border-color:var(--green);color:var(--green)}
.type.active.expense{border-color:var(--red);color:var(--red)}
input,select{width:100%;padding:14px;background:var(--panel2);color:white;border:1px solid #35435b;border-radius:11px;font-family:inherit;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--blue)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.submit{background:var(--green);color:#10241f;padding:15px;border-radius:12px;font-size:15px;font-weight:bold}
.list{display:grid;gap:9px}
.item{background:var(--panel2);padding:14px;border-radius:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-title{font-size:13px;font-weight:bold}
.item-date{font-size:10px;color:var(--muted);margin-top:7px}
.item-right{text-align:left;white-space:nowrap}
.item-amount{font-size:13px;font-weight:bold}
.delete{background:transparent;color:var(--red);font-size:18px;margin-right:8px}
.actions{display:flex;gap:7px}
.action{padding:7px 10px;border-radius:8px;background:#35435b;color:white;font-size:11px}
.empty{text-align:center;color:var(--muted);padding:25px;font-size:13px}
footer{text-align:center;color:var(--muted);font-size:10px;padding:25px}
dialog{background:var(--panel);color:white;border:1px solid #40516a;border-radius:18px;width:90%;max-width:400px;padding:22px}
dialog::backdrop{background:#000a}
.modal-actions{display:flex;gap:8px;margin-top:15px}
.modal-actions button{flex:1;padding:12px;border-radius:10px}
@media(max-width:420px){body{padding:13px}.amount{font-size:16px}.brand{font-size:20px}.card{padding:14px}}
</style>
</head>
<body>
<div class="app">
<header>
<div>
<div class="brand">◈ <span id="brandName">دخل و خرج من</span></div>
<div class="sub">مدیریت هوشمند دخل و خرج روزانه</div>
</div>
<button class="settings" onclick="openSettings()">⚙</button>
</header>

<div class="welcome">
<small>موجودی کل حساب</small>
<h2 id="balance">0</h2>
<div class="date" id="today"></div>
</div>

<div class="cards">
<div class="card"><small>↗ مجموع درآمد این ماه</small><div class="amount green" id="incomeTotal">0</div></div>
<div class="card"><small>↘ مجموع هزینه این ماه</small><div class="amount red" id="expenseTotal">0</div></div>
<div class="card"><small>درآمد امروز</small><div class="amount green" id="todayIncome">0</div></div>
<div class="card"><small>هزینه امروز</small><div class="amount red" id="todayExpense">0</div></div>
</div>

<div class="section">
<div class="section-head">
<h3>گزارش تصویری این ماه</h3>
<span class="legend">
<span><i class="dot" style="background:var(--green)"></i>درآمد</span>
<span><i class="dot" style="background:var(--red)"></i>هزینه</span>
</span>
</div>
<div class="panel"><div id="chart" class="chart"></div></div>
</div>

<div class="section">
<div class="section-head"><h3>＋ ثبت تراکنش جدید</h3></div>
<div class="panel">
<form id="entryForm">
<div class="types">
<button type="button" class="type active income" id="incomeBtn" onclick="setType('income')">＋ درآمد</button>
<button type="button" class="type expense" id="expenseBtn" onclick="setType('expense')">－ هزینه</button>
</div>
<div>
<label>مبلغ (تومان)</label>
<input id="amount" type="text" inputmode="numeric" placeholder="2,500,000" required>
</div>
<div>
<label>بابت چی بوده؟</label>
<input id="description" type="text" placeholder="مثلاً خرید، حقوق، فروش..." required>
</div>
<div class="fields">
<div>
<label>دسته‌بندی</label>
<select id="category">
<option>عمومی</option><option>حقوق</option><option>فروش</option>
<option>خرید</option><option>خوراک</option><option>رفت‌وآمد</option>
<option>قبض</option><option>تفریح</option><option>درمان</option><option>سایر</option>
</select>
</div>
<div>
<label>تاریخ شمسی</label>
<input id="date" type="text" inputmode="numeric" placeholder="1405/09/01" maxlength="10" required>
</div>
</div>
<button class="submit" type="submit" id="submitBtn">ثبت تراکنش</button>
</form>
</div>
</div>

<div class="section">
<div class="section-head">
<h3>آخرین تراکنش‌ها</h3>
<select id="filter" style="width:125px;padding:9px" onchange="renderList()">
<option value="all">همه</option>
<option value="income">درآمدها</option>
<option value="expense">هزینه‌ها</option>
</select>
</div>
<div class="list" id="transactions"></div>
</div>
<footer>مدیریت مالی شخصی • اطلاعات ذخیره‌شده روی دستگاه شما</footer>
</div>

<dialog id="settings">
<h3>⚙ تنظیمات برنامه</h3>
<div style="margin-top:18px">
<label>نام دلخواه برنامه</label>
<input id="nameInput" placeholder="مثلاً دخل و خرج سعید">
</div>
<div style="margin-top:14px">
<label>رنگ اصلی برنامه</label>
<select id="themeInput">
<option value="green">سبز</option><option value="blue">آبی</option><option value="gold">طلایی</option>
</select>
</div>
<div class="modal-actions">
<button style="background:var(--green);color:#10241f" onclick="saveSettings()">ذخیره</button>
<button style="background:var(--panel2);color:white" onclick="$('settings').close()">بستن</button>
</div>
</dialog>

<script>
// تبدیل تاریخ شمسی و میلادی
const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
const div=(a,b)=>Math.floor(a/b);
const mod=(a,b)=>a-Math.floor(a/b)*b;

function jalCal(jy){
let gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump;
for(let i=1;i<breaks.length;i++){
jm=breaks[i];jump=jm-jp;
if(jy<jm)break;
leapJ+=div(jump,33)*8+div(mod(jump,33),4);
jp=jm;
}
let n=jy-jp;
leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
if(mod(jump,33)===4&&jump-n===4)leapJ++;
let leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
let march=20+leapJ-leapG;
if(jump-n<6)n=n-jump+div(jump+4,33)*33;
let leap=mod(mod(n+1,33)-1,4);
if(leap===-1)leap=4;
return{leap,gy,march};
}
function g2d(gy,gm,gd){
let d=div((gy+div(gm-8,6)+100100)*1461,4)
+div(153*mod(gm+9,12)+2,5)+gd-34840408;
return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
}
function d2g(jdn){
let j=4*jdn+139361631;
j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
let i=div(mod(j,1461),4)*5+308;
let gd=div(mod(i,153),5)+1;
let gm=mod(div(i,153),12)+1;
let gy=div(j,1461)-100100+div(8-gm,6);
return{gy,gm,gd};
}
function j2d(jy,jm,jd){
let r=jalCal(jy);
return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;
}
function d2j(jdn){
let gy=d2g(jdn).gy;
let jy=gy-621;
let r=jalCal(jy);
let jdn1f=g2d(gy,3,r.march);
let k=jdn-jdn1f;
let jm,jd;
if(k>=0){
if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy,jm,jd};}
k-=186;
}else{
jy--;
k+=179;
if(r.leap===1)k++;
}
jm=7+div(k,30);
jd=mod(k,30)+1;
return{jy,jm,jd};
}
function toGregorian(jy,jm,jd){
const g=d2g(j2d(jy,jm,jd));
return `${g.gy}-${String(g.gm).padStart(2,'0')}-${String(g.gd).padStart(2,'0')}`;
}
function toJalali(iso){
const [y,m,d]=iso.split('-').map(Number);
return d2j(g2d(y,m,d));
}
function jalaliString(iso){
const j=toJalali(iso);
return `${j.jy}/${String(j.jm).padStart(2,'0')}/${String(j.jd).padStart(2,'0')}`;
}
function parseJalali(s){
const match=s.trim().match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
if(!match)return null;
const jy=+match[1],jm=+match[2],jd=+match[3];
if(jm<1||jm>12||jd<1||jd>(jm<=6?31:jm<=11?30:(jalCal(jy).leap===0?30:29)))return null;
const iso=toGregorian(jy,jm,jd);
const check=toJalali(iso);
if(check.jy!==jy||check.jm!==jm||check.jd!==jd)return null;
return iso;
}
function todayISO(){
const d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat('en-US');
let data=[];
try{data=JSON.parse(localStorage.getItem('dakhl_data')||'[]')}catch(e){data=[]}
let type='income',editId=null;

function save(){localStorage.setItem('dakhl_data',JSON.stringify(data))}
function money(n){return nf.format(Math.round(n||0))+' تومان'}
function setType(t){
type=t;
$('incomeBtn').classList.toggle('active',t==='income');
$('expenseBtn').classList.toggle('active',t==='expense');
}
function openSettings(){
$('nameInput').value=localStorage.getItem('dakhl_name')||'دخل و خرج من';
$('themeInput').value=localStorage.getItem('dakhl_theme')||'green';
$('settings').showModal();
}
function saveSettings(){
localStorage.setItem('dakhl_name',$('nameInput').value.trim()||'دخل و خرج من');
localStorage.setItem('dakhl_theme',$('themeInput').value);
applySettings();
$('settings').close();
}
function applySettings(){
$('brandName').textContent=localStorage.getItem('dakhl_name')||'دخل و خرج من';
const colors={green:'#27d6a0',blue:'#718cff',gold:'#f5c76b'};
document.documentElement.style.setProperty('--green',colors[localStorage.getItem('dakhl_theme')]||colors.green);
}

function render(){
const now=todayISO();
const todayJ=toJalali(now);
const monthItems=data.filter(x=>{
const j=toJalali(x.date);
return j.jy===todayJ.jy&&j.jm===todayJ.jm;
});
const inc=monthItems.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
const exp=monthItems.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
const ti=data.filter(x=>x.date===now&&x.type==='income').reduce((s,x)=>s+x.amount,0);
const te=data.filter(x=>x.date===now&&x.type==='expense').reduce((s,x)=>s+x.amount,0);
const allIn=data.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
const allOut=data.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
$('balance').textContent=money(allIn-allOut);
$('incomeTotal').textContent=money(inc);
$('expenseTotal').textContent=money(exp);
$('todayIncome').textContent=money(ti);
$('todayExpense').textContent=money(te);
$('today').textContent='امروز: '+jalaliString(now);
renderChart(monthItems,todayJ);
renderList();
}

function renderChart(items,todayJ){
const chart=$('chart');
chart.innerHTML='';
const days=todayJ.jm<=6?31:todayJ.jm<=11?30:(jalCal(todayJ.jy).leap===0?30:29);
const groups=[];
for(let i=1;i<=days;i++){
const key=`${todayJ.jy}/${String(todayJ.jm).padStart(2,'0')}/${String(i).padStart(2,'0')}`;
const a=items.filter(x=>jalaliString(x.date)===key);
groups.push({
day:i,
inc:a.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),
exp:a.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)
});
}
const recent=groups.slice(Math.max(0,groups.length-7));
const max=Math.max(1,...recent.map(x=>Math.max(x.inc,x.exp)));
recent.forEach(g=>{
const col=document.createElement('div');
col.className='chart-col';
const area=document.createElement('div');
area.className='bar-area';
const a=document.createElement('div');
a.className='bar in';
a.style.height=Math.max(3,g.inc/max*100)+'%';
const b=document.createElement('div');
b.className='bar out';
b.style.height=Math.max(3,g.exp/max*100)+'%';
area.append(a,b);
const label=document.createElement('div');
label.className='chart-label';
label.textContent=g.day;
col.append(area,label);
chart.append(col);
});
}

function renderList(){
const box=$('transactions');
box.innerHTML='';
const filter=$('filter').value;
const arr=[...data].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)
.filter(x=>filter==='all'||x.type===filter);
if(!arr.length){
box.innerHTML='<div class="empty">هنوز تراکنشی ثبت نشده است.</div>';
return;
}
arr.forEach(x=>{
const el=document.createElement('div');el.className='item';
const right=document.createElement('div');
const title=document.createElement('div');title.className='item-title';title.textContent=x.description;
const date=document.createElement('div');date.className='item-date';
date.textContent=jalaliString(x.date)+' • '+x.category;
right.append(title,date);
const left=document.createElement('div');left.className='item-right';
const amount=document.createElement('div');
amount.className='item-amount '+(x.type==='income'?'green':'red');
amount.textContent=(x.type==='income'?'+ ':'− ')+money(x.amount);
const actions=document.createElement('div');actions.className='actions';actions.style.marginTop='7px';
const edit=document.createElement('button');edit.className='action';edit.textContent='ویرایش';edit.onclick=()=>editItem(x.id);
const del=document.createElement('button');del.className='delete';del.textContent='×';del.onclick=()=>deleteItem(x.id);
actions.append(edit,del);left.append(amount,actions);el.append(right,left);box.append(el);
});
}
function editItem(id){
const x=data.find(a=>a.id===id);if(!x)return;
editId=id;setType(x.type);
$('amount').value=nf.format(x.amount);
$('description').value=x.description;
$('category').value=x.category;
$('date').value=jalaliString(x.date);
$('submitBtn').textContent='ذخیره تغییرات';
$('entryForm').scrollIntoView({behavior:'smooth'});
}
function deleteItem(id){
if(!confirm('این تراکنش حذف شود؟'))return;
data=data.filter(x=>x.id!==id);save();render();
}
$('amount').addEventListener('input',e=>{
const v=e.target.value.replace(/[^\d]/g,'');
e.target.value=v?nf.format(Number(v)):'';
});
$('date').addEventListener('input',e=>{
e.target.value=e.target.value.replace(/[^\d/]/g,'');
});
$('entryForm').addEventListener('submit',e=>{
e.preventDefault();
const amount=Number($('amount').value.replace(/,/g,''));
const description=$('description').value.trim();
const date=parseJalali($('date').value);
if(!amount||amount<=0||!description||!date){
alert('تاریخ شمسی را به شکل 1405/09/01 وارد کن و مبلغ و شرح را کامل کن.');
return;
}
const item={
id:editId||Date.now(),
type,amount,description,date,
category:$('category').value
};
if(editId)data=data.map(x=>x.id===editId?item:x);
else data.push(item);
save();
$('entryForm').reset();
$('date').value=jalaliString(todayISO());
editId=null;
setType('income');
$('submitBtn').textContent='ثبت تراکنش';
render();
});
$('date').value=jalaliString(todayISO());
applySettings();
render();
</script>
</body>
</html>
